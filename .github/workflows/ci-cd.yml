name: CI/CD Azure App Service

env:
  # Versión de Node compartida por todos los jobs.
  NODE_VERSION: 24

on:
  push:
    branches: [Development, QA, main]
  pull_request:
    branches: [Development, QA, main]

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Dependencias base para el resto del pipeline.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install
        run: npm ci

  lint:
    name: Lint
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Lint independiente para cortar feedback rápido antes de build/test.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Opción B (híbrida): en CI se valida con SQLite local reproducible.
      DATABASE_URL: file:./prisma/dev.db
    steps:
      # Build de producción. Usa fallback SQLite cuando no hay secret disponible.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build app
        run: npm run build

  test-e2e:
    name: E2E Tests
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Opción B (híbrida): E2E en CI corre con SQLite local.
      DATABASE_URL: file:./prisma/dev.db
      PORT: '3200'
    steps:
      # Playwright gestiona su propio webServer; este job no debe arrancar otra app en paralelo.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-npm-

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Apply Prisma migrations for E2E
        run: npx prisma migrate deploy

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  deploy:
    name: Deploy to Azure App Service
    needs: [test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fase actual: despliegue en Azure tras validar CI local.
      # Fase siguiente (pendiente): validación post-deploy contra Azure PostgreSQL.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: logiztik-catalogo
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
